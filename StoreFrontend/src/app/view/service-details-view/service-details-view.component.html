@if (service && shop) {
<app-view-title title="Service {{ service.name }}" />

<mat-card>
  <mat-card-header>
    <mat-card-title>{{ service.name }} </mat-card-title>
    <mat-card-subtitle>Category: {{ service.name }}</mat-card-subtitle>
    <mat-card-subtitle>Price: {{ service.price }}</mat-card-subtitle>
    <mat-card-subtitle>Stock: {{ service.duration }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions>
    <button
      mat-button
      [routerLink]="[
        '/shops',
        shop.shopId,
        'services',
        service.serviceId,
        'edit'
      ]"
    >
      Edit
    </button>
    <button mat-button [routerLink]="['/shops', shop.shopId]">
      Show the {{ shop.name }} category
    </button>
    <app-error-message [message]="message" />
  </mat-card-actions>
</mat-card>
} @else {<app-error-message [message]="message" />}
