<form #form="ngForm" (ngSubmit)="onSubmit()">
  <p>
    <mat-form-field>
      <label for="name">Name</label>
      <input
        matInput
        type="text"
        id="name"
        name="name"
        [(ngModel)]="shop.name"
      />
    </mat-form-field>
  </p>
  <p>
    <mat-form-field>
      <label for="description">Description</label>
      <input
        matInput
        type="text"
        id="description"
        name="description"
        [(ngModel)]="shop.location"
      />
    </mat-form-field>
  </p>
  <p>
    <mat-form-field>
      <label for="phoneNumber">phoneNumber</label>
      <input
        matInput
        type="text"
        id="phoneNumber"
        name="phoneNumber"
        [(ngModel)]="shop.phoneNumber"
      />
    </mat-form-field>
  </p>
  <p>
    <mat-form-field>
      <label for="email">Email</label>
      <input
        matInput
        type="text"
        id="email"
        name="email"
        [(ngModel)]="shop.email"
      />
    </mat-form-field>
  </p>
  <p>
    <mat-form-field>
      <label for="ownerName">ownerName</label>
      <input
        matInput
        type="text"
        id="ownerName"
        name="ownerName"
        [(ngModel)]="shop.ownerName"
      />
    </mat-form-field>
  </p>
  <p>
    <mat-form-field>
      <label for="rating">Rating</label>
      <input
        matInput
        type="number"
        id="rating"
        name="rating"
        onkeydown="this.value = this.value.replace(/[^0-9]/, '');"
        [(ngModel)]="shop.rating"
      />
    </mat-form-field>
  </p>
  <button mat-raised-button type="submit">Save</button>
  <app-error-message [message]="message" />
</form>
